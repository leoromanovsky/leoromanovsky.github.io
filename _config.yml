# Site settings — available in templates as {{ site.<key> }}.
# Restart `bundle exec jekyll serve` after editing this file.

title: Leo Romanovsky
description: Head in the Cloud
url: "https://leoromanovsky.com"
baseurl: ""
lang: en

author:
  name: Leo Romanovsky

twitter_username: leoromanovsky
github_username: leoromanovsky

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - vendor/
