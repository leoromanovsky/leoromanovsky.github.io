---
layout: default
---
<article class="wrap page{% if page.wide %} wide{% endif %}">
  <header class="page-header">
    {%- if page.kicker %}<p class="kicker mono">{{ page.kicker }}</p>{% endif %}
    <h1 class="page-title">{{ page.title | escape }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
